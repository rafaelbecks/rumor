name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DRUMOR_WITH_PAULXSTRETCH=ON \
            -DRUMOR_BUILD_PLUGIN=ON \
            -DRUMOR_BUILD_TESTS=ON
      - name: Build Standalone
        run: cmake --build build --target Rumor_Standalone -j3
      - name: Upload macOS Standalone
        uses: actions/upload-artifact@v4
        with:
          name: rumor-macos-standalone
          path: build/Rumor_artefacts/**/Standalone/RUMOR.app
          if-no-files-found: warn

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DRUMOR_WITH_PAULXSTRETCH=ON `
            -DRUMOR_BUILD_PLUGIN=ON `
            -DRUMOR_BUILD_TESTS=ON
      - name: Build Standalone
        run: cmake --build build --config Release --target Rumor_Standalone
      - name: Upload Windows Standalone
        uses: actions/upload-artifact@v4
        with:
          name: rumor-windows-standalone
          path: build/Rumor_artefacts/**/Standalone/RUMOR.exe
          if-no-files-found: warn
